<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acadex · Yönetim</title>
<link rel="icon" type="image/png" href="assets/logo-icon-only.png">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<a class="skip" href="#adm-main">İçeriğe geç</a>

<!-- giriş / doğrulama ekranı -->
<section class="gate" id="gate" aria-live="polite">
  <div class="gate-card">
    <span class="tape" aria-hidden="true"></span>
    <div class="brand"><img src="assets/logo-icon-only.png" alt="" width="28" height="28"><span class="mono">ACADEX · YÖNETİM</span></div>
    <div id="gate-body"><p class="muted">yükleniyor…</p></div>
  </div>
</section>

<!-- panel -->
<div class="app" id="app" hidden>
  <aside class="side" aria-label="Yönetim menüsü">
    <div class="brand"><img src="assets/logo-icon-only.png" alt="" width="26" height="26"><span><b>Acadex</b><small class="hand">yönetim masası</small></span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span class="me" id="me-name">—</span>
      <a href="dashboard.html" class="lnk">öğrenci paneline dön</a>
      <button type="button" class="lnk" id="btn-out">çıkış yap</button>
    </div>
  </aside>
  <div class="main-wrap">
    <header class="top">
      <button type="button" class="menu-b" id="menu-b" aria-label="Menüyü aç" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="top-t"><span class="mono crumb" id="crumb">GENEL BAKIŞ</span><h1 class="disp" id="page-t">Genel bakış</h1></div>
      <div class="top-r"><span class="pill warn" id="maint-pill" hidden>bakım modu açık</span><button type="button" class="btn ghost sm" id="btn-refresh">yenile</button></div>
    </header>
    <main id="adm-main" tabindex="-1"></main>
  </div>
</div>

<!-- detay çekmecesi -->
<div class="drawer-back" id="drawer-back" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-t" hidden>
  <header><h2 class="disp" id="drawer-t">Detay</h2><button type="button" class="x" id="drawer-x" aria-label="Kapat">×</button></header>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/acadex-bolumler.js"></script>
<script src="js/admin-app.js"></script>
</body>
</html>
