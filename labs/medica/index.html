<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acadex Medica · eğitim hastanesi</title>
<meta name="theme-color" content="#F3F7F9">
<script>/* MedLab köprüsü: iframe içinde (?medlab=1) */if(window.parent!==window&&/[?&]medlab=1(&|$)/.test(location.search))document.documentElement.classList.add('axm-embed')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ACADEX MEDICA · görsel sistem "eğitim hastanesi" (31.10.2026)
   Duvar: açık gri-mavi, zemin: hastane karosu, yön bulma: her katın rengi
   Rehber: maskeli, ameliyata hazır cerrah · Asansör: çelik kapılar, kat göstergesi
   ===================================================================== */
:root{--ink:#0D1838;--ink2:#46506A;--muted:#6A7593;--paper:#FFFFFF;--bg:#EEF2F5;--line:#DCE2EA;--mint:#2E9C86;--mint-s:#E2F4EF;--ok:#2E8E5B;--warn:#B9821F;--bad:#C9483B;--r:16px;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2F6BFF;outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:'JetBrains Mono',monospace}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.5}

/* ---------- üst çubuk ---------- */
.md-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:0 3px 0 var(--mint)}
.md-logo{display:flex;align-items:center;gap:10px;flex:none}
.md-logo i{position:relative;width:34px;height:34px;border-radius:10px;background:var(--ink);flex:none}
.md-logo i::before,.md-logo i::after{content:"";position:absolute;background:#E5544A;border-radius:2px}
.md-logo i::before{left:14px;top:7px;width:6px;height:20px}.md-logo i::after{left:7px;top:14px;width:20px;height:6px}
.md-logo b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;line-height:1.05}
.md-logo small{display:block;font-family:'Caveat',cursive;font-size:16px;color:var(--mint);line-height:1}
.md-yer{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#F3F6F9;border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.md-yer i{width:10px;height:10px;border-radius:3px;flex:none}
.md-nob{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1.5px solid #E5544A;background:#FFF3F1;color:#A8332A;font-size:12.5px;font-weight:700;white-space:nowrap}
.md-nob[hidden]{display:none}
.nb-dot{width:8px;height:8px;border-radius:50%;background:#E5544A;flex:none;animation:nb 1.4s ease-in-out infinite}
@keyframes nb{50%{opacity:.25}}
.md-top-r{margin-left:auto;display:flex;gap:8px;flex:none}
.md-tb{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:13.5px}
.md-tb:hover{border-color:var(--ink)}
.md-tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- ekranlar ---------- */
.md-ekran{max-width:1320px;margin:0 auto;padding:22px 18px 40px;animation:in .45s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.md-sahne-k{position:relative;border-radius:var(--r);overflow:hidden;background:#E3EBF0;border:1px solid var(--line);box-shadow:0 24px 50px -36px rgba(13,24,56,.6)}
.sahne{display:block;width:100%;height:auto}
.md-panel{margin-top:14px;padding:16px 18px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:0 14px 30px -26px rgba(13,24,56,.5);min-height:120px}
.md-say .who{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:var(--mint)}
.md-say .who.mentor{background:var(--kc,#2F6BFF)}
.md-say p{margin:8px 0 0;font-size:16px;line-height:1.55;min-height:3.1em;cursor:pointer}
.md-say .cur{display:inline-block;width:8px;height:1em;background:var(--ink);vertical-align:-2px;margin-left:2px;animation:nb .8s steps(2) infinite}
.md-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.md-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;font-size:14.5px;transition:transform .15s var(--ease),background .2s}
.md-btn:hover{transform:translateY(-1px)}
.md-btn.pri{background:var(--ink);color:#fff}
.md-row.bolum{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.md-btn.kat{justify-content:flex-start;border-radius:14px;border-color:var(--line);padding:0 14px 0 8px;min-height:52px}
.md-btn.kat b{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:#fff;font-family:'JetBrains Mono',monospace;flex:none}
.md-btn.kat.sec{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.md-btn.kat:hover{border-color:var(--ink)}

/* giriş sahnesi: kapılar açılır, cerrah yürür, maske konuşurken kabarır */
.sahne .kapi1,.sahne .kapi2{transition:transform 1s var(--ease)}
.sahne.acik .kapi1{transform:translateX(-96px)}.sahne.acik .kapi2{transform:translateX(96px)}
.sahne .cerrah .govde{transition:transform 1.25s cubic-bezier(.4,0,.2,1),opacity .4s}
.sahne .cerrah.gelis .govde{transform:translateX(-380px);opacity:0}
.sahne.geldi .cerrah.gelis .govde{transform:none;opacity:1}
.sahne .nefes{animation:nefes 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nefes{50%{transform:scaleY(1.015)}}
.sahne .goz{animation:goz 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes goz{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.sahne .kolL,.sahne .kolR{transform-box:fill-box;transform-origin:50% 100%;animation:kol 3s ease-in-out infinite}
.sahne .kolR{animation-delay:-1.5s}
@keyframes kol{50%{transform:rotate(-3deg) translateY(-2px)}}
.sahne.konusuyor .maske{animation:maske .32s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes maske{to{transform:scaleY(1.07)}}
.sahne .serit .nabiz{stroke-dasharray:6 94;stroke-dashoffset:100;opacity:.9;animation:serit 3s linear infinite}
@keyframes serit{to{stroke-dashoffset:0}}
.sahne .isik{animation:isik 5s ease-in-out infinite}
@keyframes isik{50%{opacity:.22}}
.sahne .sway{animation:sway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(1.5deg)}}
.sahne .asn{cursor:pointer}.sahne .asn:hover rect:first-child{fill:#9FAABA}
.sahne .asn-btn{animation:nb 1.6s ease-in-out infinite}
.sahne .ekr{animation:ekr 3s ease-in-out infinite}
@keyframes ekr{50%{fill:#A8EAD4}}

/* kat: bekleme salonu */
.md-ekran.kat{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.sahne .hb{cursor:pointer;outline:none}
.sahne .hb .hb-k{transition:transform .3s var(--spring),filter .2s,opacity .9s}
.sahne .hb:hover .hb-k,.sahne .hb:focus-visible .hb-k{transform:translateY(-6px);filter:drop-shadow(0 0 0 #0D1838) drop-shadow(0 6px 10px rgba(13,24,56,.25))}
.sahne .hb:focus-visible rect{stroke-width:4}
.sahne .hb.gor .hb-k{opacity:.62}
.sahne .hb.sirada>g:last-child rect{animation:bilet 1.4s ease-in-out infinite}
@keyframes bilet{50%{fill:#FFF3D2}}
.sahne .hb.kalk .hb-k{transform:translate(220px,-12px)!important;opacity:0;transition:transform .9s ease-in,opacity .9s ease-in}
.sahne .pano-no.flas{animation:flas .25s steps(2) 6}
@keyframes flas{50%{fill:#0D1838}}
.sahne .pano-led,.sahne .oda-led{animation:nb 2s ease-in-out infinite}
.sahne .servis{cursor:pointer}.sahne .servis:hover rect{fill:var(--ka)}
.sahne [data-who="kat-mentor"] .blink,.sahne .kisi .blink{animation:goz 5s infinite;transform-box:fill-box;transform-origin:center}
.sahne .kisi .breath{animation:nefes 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.md-liste{position:sticky;top:86px;max-height:calc(100vh - 106px);overflow:auto;padding:16px;border-radius:var(--r);background:#fff;border:1px solid var(--line);border-top:8px solid var(--kc);box-shadow:0 14px 30px -26px rgba(13,24,56,.5)}
.md-liste h2{margin:2px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;letter-spacing:-.01em}
.md-liste h3{margin:16px 0 8px;font-size:13px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.md-hl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hk{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;transition:border-color .2s,transform .15s}
.hk:hover{border-color:var(--kc);transform:translateX(2px)}
.hk .no{display:grid;place-items:center;min-width:46px;height:34px;border-radius:8px;background:var(--ka);color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;flex:none;border:1.5px solid var(--kc)}
.hk .tx{display:grid;gap:1px;min-width:0;flex:1}
.hk .tx b{font-size:14.5px}.hk .tx b small{font-weight:500;color:var(--muted)}
.hk .tx span{font-size:13px;color:var(--ink2);line-height:1.35}
.hk .tx>small{font-size:11.5px;color:var(--muted)}
.hk .st{flex:none;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.hk .st.bek{background:#F3F6F9;color:var(--muted)}.hk .st.ok{background:#E3F4EA;color:var(--ok)}.hk .st.orta{background:#FFF4DC;color:#8A5A00}.hk .st.zay{background:#FBE9E6;color:var(--bad)}
.hk.gor .no{background:#E3F4EA;border-color:var(--ok)}
.md-nobet-k{margin-top:12px;padding:12px;border-radius:12px;background:#F7F9FB;border:1px dashed var(--line);display:grid;gap:8px}
.md-nobet-k small{color:var(--muted);font-size:12.5px;line-height:1.4}
.md-nobet-k .nk-u{display:flex;align-items:center;gap:8px}.md-nobet-k .nk-u .mono{margin-left:auto;font-weight:700;font-size:18px}
.md-nobet-k p{margin:0;font-size:13px;color:var(--ink2)}
.nk-b{display:flex;gap:6px}.nk-b span{flex:1;height:8px;border-radius:4px;background:#DCE2EA}.nk-b span.ok{background:var(--ok)}.nk-b span.su{background:#E5544A;animation:nb 1.2s infinite}

/* ---------- asansör geçişi ---------- */
.md-asansor{position:fixed;inset:0;z-index:8000;pointer-events:none}
.md-asansor[hidden]{display:none}
.md-asansor .kp{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(90deg,#BCC6D2,#E8EDF3 45%,#C9D1DC);transition:transform .6s cubic-bezier(.6,0,.3,1);box-shadow:inset 0 0 0 1px #9AA6B8}
.md-asansor .kp::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:#8D98A8}
.md-asansor .kL{left:0;transform:translateX(-101%)}.md-asansor .kL::after{right:0}
.md-asansor .kR{right:0;transform:translateX(101%)}.md-asansor .kR::after{left:0}
.md-asansor.kapan .kL,.md-asansor.kapan .kR{transform:none}
.md-asansor.kapan.acil .kL{transform:translateX(-101%)}.md-asansor.kapan.acil .kR{transform:translateX(101%)}
.md-asansor .gosterge{position:absolute;left:50%;top:18%;z-index:2;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:14px 26px;border-radius:14px;background:#0D1838;color:#FFB547;font-family:'JetBrains Mono',monospace;box-shadow:0 20px 40px -20px rgba(0,0,0,.7);opacity:0;transition:opacity .3s}
.md-asansor.kapan .gosterge{opacity:1}.md-asansor.kapan.acil .gosterge{opacity:0}
.md-asansor .gosterge b{font-size:56px;line-height:1;min-width:1.2ch;text-align:center}
.md-asansor .gosterge i{font-style:normal;font-size:34px;color:#7FE0C2}
.md-asansor .gosterge small{position:absolute;left:0;right:0;top:100%;margin-top:10px;text-align:center;font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:15px;color:#0D1838;white-space:nowrap}
.md-asansor .kp{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 7px),linear-gradient(90deg,#BCC6D2,#E8EDF3 45%,#C9D1DC)}
.md-asansor.tik .gosterge b{animation:tik .4s var(--spring)}
@keyframes tik{from{transform:translateY(10px);opacity:.3}}

/* ---------- lab (iç çerçeve) ---------- */
.md-muayene{position:fixed;inset:0;z-index:7000;display:flex;flex-direction:column;background:#fff}
.md-muayene[hidden]{display:none}
.md-mu-top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#0D1838;color:#fff}
.md-mu-top .md-btn{border-color:rgba(255,255,255,.4);background:transparent;color:#fff;min-height:40px}
.md-mu-top .md-btn.pri{background:#7FE0C2;color:#0D1838;border-color:#7FE0C2}
.md-mu-top b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-mu-top small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#BFC9DD}
.md-mu-s{width:8px;height:8px;border-radius:50%;background:#FFB547;animation:nb 1.4s infinite}.md-mu-s.ok{background:#7FE0C2;animation:none}
.md-mu-top .t{min-width:0;flex:1}
.md-muayene iframe{flex:1;width:100%;border:0}
.md-mu-yuk{position:absolute;left:0;right:0;top:56px;bottom:0;display:grid;place-items:center;background:#fff;font-family:'Caveat',cursive;font-size:26px;color:var(--ink2)}
.md-mu-yuk[hidden]{display:none}
body.md-labda{overflow:hidden}

/* ---------- pencere, karne ---------- */
.md-modal{position:fixed;inset:0;z-index:9500;display:grid;place-items:center;padding:16px;background:rgba(13,24,56,.55);animation:in .25s ease both}
.md-mk{position:relative;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px;border-radius:18px;background:#fff;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.md-mk h2{margin:4px 0 2px;font-family:'Bricolage Grotesque',sans-serif;font-size:24px;letter-spacing:-.01em;padding-right:100px}
.md-mk h3{margin:18px 0 8px;font-size:13px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.md-x{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;border-radius:10px;background:#F3F6F9;font-size:22px;z-index:2}
.md-asn-panel{padding:4px 4px 6px;border-radius:14px}
.md-asn-b{display:grid;gap:8px;margin-top:12px}
.md-asn-b button{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1.5px solid var(--line);border-radius:14px;background:linear-gradient(90deg,#F7F9FB,#fff);text-align:left}
.md-asn-b button:hover,.md-asn-b button[aria-current]{border-color:var(--kc)}
.md-asn-b b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--kc);color:#fff;font-family:'JetBrains Mono',monospace;font-size:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 0 0 4px #E3E8EE;flex:none}
.md-asn-b span{display:grid;font-weight:700;font-size:15px}.md-asn-b small{font-weight:500;color:var(--muted);font-size:12.5px}
.md-karne{position:relative}
.damga{position:absolute;right:46px;top:-4px;width:86px;height:86px;border-radius:50%;border:3px solid currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);font-family:'JetBrains Mono',monospace;animation:damga .45s var(--spring) .15s both}
.damga b{font-size:26px;line-height:1}.damga small{font-size:9px;letter-spacing:.1em}
@keyframes damga{from{transform:rotate(-12deg) scale(1.8);opacity:0}}
.tw{overflow-x:auto;margin-top:12px}
.md-karne table{width:100%;border-collapse:collapse;font-size:13.5px}
.md-karne th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:1.5px solid var(--line)}
.md-karne td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.md-karne td small{display:block;color:var(--muted);font-size:12px}.md-karne td small.kc{color:var(--bad)}
.md-karne .n{text-align:right;white-space:nowrap}
.md-karne .not{margin:12px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.md-katlar{display:grid;gap:8px;margin-top:12px}
.md-katlar .kd{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#F7F9FB;overflow:hidden}
.md-katlar .kd b{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--kc);color:#fff;font-family:'JetBrains Mono',monospace;flex:none;z-index:1}
.md-katlar .kd span{display:grid;font-weight:700;font-size:14px;z-index:1}.md-katlar .kd small{font-weight:500;color:var(--muted);font-size:12px}
.md-katlar .kd i{position:absolute;left:0;bottom:0;height:4px;background:var(--kc)}
.md-def{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.md-def button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.md-def .dt{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);min-width:64px}
.md-def span:not(.dt){display:grid;flex:1;font-weight:700;font-size:14px}.md-def small{font-weight:500;color:var(--muted);font-size:12px}
.md-def b{font-family:'JetBrains Mono',monospace;font-size:18px}

.toast{position:fixed;left:50%;bottom:22px;z-index:9800;transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.md-not{max-width:1320px;margin:0 auto;padding:0 18px 30px;color:var(--muted);font-size:12.5px;text-align:center}

/* ---------- canlı hastane (31.10.2026): vakit, yürüyen personel, anons ---------- */
.md-saat{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#F3F6F9;border:1px solid var(--line);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.md-saat svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.md-saat b{font-size:13.5px;color:var(--ink)}
.sahne{--gok1:#9ED3F2;--gok2:#D6EEFA}
.sahne[data-vakit="sabah"]{--gok1:#FFD3A1;--gok2:#BFE3F7}
.sahne[data-vakit="aksam"]{--gok1:#F2955F;--gok2:#7A5FB0}
.sahne[data-vakit="gece"]{--gok1:#0F1A3D;--gok2:#2B3F78}
.sahne .sehir{fill:#8FA3BE}.sahne[data-vakit="aksam"] .sehir{fill:#5B4B7E}.sahne[data-vakit="gece"] .sehir{fill:#1A2550}
.sahne .yildiz,.sahne .ay,.sahne .pencereler{opacity:0;transition:opacity 1.2s}
.sahne[data-vakit="gece"] .yildiz,.sahne[data-vakit="gece"] .ay,.sahne[data-vakit="gece"] .pencereler,.sahne[data-vakit="aksam"] .pencereler{opacity:1}
.sahne[data-vakit="gece"] .gunes,.sahne[data-vakit="gece"] .bulut{opacity:0}
.sahne[data-vakit="sabah"] .gunes{transform:translateY(22px)}
.sahne[data-vakit="aksam"] .gunes{fill:#FF9F5A;transform:translateY(28px)}
.sahne .yildiz circle{animation:yildiz 3s ease-in-out infinite}
@keyframes yildiz{50%{opacity:.35}}
.sahne .bulut{animation:bulut 40s linear infinite}
@keyframes bulut{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.sahne .vakit-ton{fill:transparent;transition:fill 1.2s}
.sahne[data-vakit="aksam"] .vakit-ton{fill:rgba(160,80,40,.06)}
.sahne[data-vakit="gece"] .vakit-ton{fill:rgba(18,28,72,.14)}
.sahne[data-vakit="gece"] .isik{opacity:.6;animation:none}
.sahne .yuru{pointer-events:none}
.sahne .yuru .adim{animation:adim .55s ease-in-out infinite alternate}
@keyframes adim{to{transform:translateY(-6px)}}
.sahne .y-hem{animation:yuruG 26s linear infinite;animation-delay:-4s}
.sahne .y-dr{animation:yuruT 34s linear infinite;animation-delay:-20s}
.sahne .y-sedye{animation:sedyeG 46s linear infinite;animation-delay:-8s}
@keyframes yuruG{0%{transform:translateX(-140px)}62%,100%{transform:translateX(1140px)}}
@keyframes yuruT{0%,30%{transform:translateX(1140px)}100%{transform:translateX(-140px)}}
@keyframes sedyeG{0%{transform:translateX(-260px)}45%,100%{transform:translateX(1180px)}}
.sahne .svk{animation:nb 1.2s ease-in-out infinite}
.md-anons{position:absolute;left:50%;top:10px;z-index:3;display:flex;align-items:center;gap:10px;max-width:min(92%,640px);padding:8px 16px 8px 8px;border-radius:999px;background:rgba(13,24,56,.92);color:#fff;font-size:14px;font-weight:600;box-shadow:0 12px 26px -14px rgba(0,0,0,.6);transform:translate(-50%,-140%);opacity:0;transition:transform .5s var(--spring),opacity .4s;pointer-events:none}
.md-anons.on{transform:translate(-50%,0);opacity:1}
.md-anons i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#7FE0C2;flex:none}
.md-anons i svg{width:18px;height:18px;fill:#0D1838;stroke:#0D1838;stroke-width:1.6;stroke-linecap:round}
.md-anons i svg path+path{fill:none}
.md-anons.kod{background:#C9483B}.md-anons.kod i{background:#fff;animation:nb .6s steps(2) infinite}

/* ---------- triyaj masası ---------- */
.ty-l{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.ty-k{padding:12px;border:1.5px solid var(--line);border-radius:14px;background:#FAFBFC}
.ty-k.ok{border-color:var(--ok);background:#F1FAF4}.ty-k.no{border-color:var(--bad);background:#FDF3F1}
.ty-u{display:grid;gap:2px}.ty-u b{font-size:15px}.ty-u b small{font-weight:500;color:var(--muted)}.ty-u span{font-size:13.5px;color:var(--ink2)}
.ty-v{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted)}
.ty-r{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ty-r button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-weight:700;font-size:13px}
.ty-r button i{width:12px;height:12px;border-radius:50%;background:var(--tr)}
.ty-r button[aria-checked="true"]{border-color:var(--tr);background:#FFF;box-shadow:0 0 0 2px var(--tr) inset}
.ty-r button.dogru{outline:2.5px dashed var(--tr);outline-offset:2px}
.ty-g{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--ink2)}.ty-g em{display:block;color:var(--bad);font-style:normal;font-weight:700}
.hk .no{position:relative}.hk .no .tr{position:absolute;left:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--tr);border:2px solid #fff}
.hk.sevkli{border-color:#0D1838;box-shadow:3px 3px 0 #FFB547}
.hk .zn{font-style:normal;font-weight:700;color:#8A5A00}
.md-tr{display:inline-flex;align-items:center;gap:6px;padding:0 12px;min-height:34px;border-radius:999px;background:#F3F6F9;font-size:12.5px;font-weight:700;color:var(--ink2);align-self:center}
.md-tr i{width:10px;height:10px;border-radius:50%;background:var(--tr)}
.md-ek{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px}
.md-ek>div{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:#F7F9FB;border-left:5px solid var(--kr,#2E9C86)}
.md-ek b{font-size:15px}.md-ek small{font-family:'JetBrains Mono',monospace;color:var(--muted)}

/* ---------- acil kod ---------- */
.md-kod{position:fixed;inset:0;z-index:9700;display:grid;place-items:center;padding:16px;background:rgba(40,8,8,.62);animation:in .2s ease both}
.kd-isik{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.kd-isik i{position:absolute;top:-30%;width:60%;height:160%;background:radial-gradient(closest-side,rgba(47,107,255,.55),transparent);animation:siren 1.1s ease-in-out infinite alternate}
.kd-isik i:first-child{left:-20%}.kd-isik i:last-child{right:-20%;animation-delay:-.55s;background:radial-gradient(closest-side,rgba(229,84,74,.55),transparent)}
@keyframes siren{from{opacity:.15}to{opacity:.9}}
.kd-k{position:relative;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 20px 16px;border-radius:18px;background:#fff;border-top:8px solid var(--kr);box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.kd-u{display:flex;align-items:center;gap:12px}
.kd-u h2{margin:4px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;flex:1}
.kd-rozet{display:inline-block;padding:4px 10px;border-radius:6px;background:var(--kr);color:#fff;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.1em;animation:nb .7s steps(2) infinite}
.kd-sure{width:58px;height:58px;flex:none}.kd-hal{transition:stroke-dashoffset 1s linear}
.md-kod.az .kd-sure{animation:nb .5s steps(2) infinite}
.kd-olay{margin:12px 0 0;font-size:15.5px;line-height:1.5;font-weight:600}
.kd-yon{margin:6px 0 0;font-size:13px;color:var(--muted)}
.kd-sira{margin:10px 0 0;padding-left:22px;display:grid;gap:4px;font-size:13.5px;color:var(--ok);font-weight:700}
.kd-sira:empty{display:none}
.kd-ad{display:grid;gap:8px;margin-top:10px}
.kd-ad button{text-align:left;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:14px}
.kd-ad button:hover:not(:disabled){border-color:var(--kr)}
.kd-ad button.ok{opacity:.45;border-style:dashed}
.kd-ad button.salla{animation:salla .4s}
@keyframes salla{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kd-fb{min-height:1.4em;margin:8px 0 0;font-size:13.5px}.kd-fb.ok{color:var(--ok)}.kd-fb.no{color:var(--bad)}
.md-kod.bitti .kd-k{border-top-color:var(--ok)}.md-kod.bitti .kd-isik{display:none}
.kd-k .damga{right:20px;top:16px}
.kd-dogru{padding-left:22px;display:grid;gap:4px;font-size:14px}
.kd-k h3{margin:16px 0 6px;font-size:13px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.kd-k .not{font-size:13.5px;line-height:1.5;color:var(--ink2)}

/* ---------- konsültasyon ---------- */
.sv-b button.dogru{border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}.sv-b button.yanlis{border-color:var(--bad);opacity:.7}
.sv-b button:disabled{cursor:default}
.sv-g{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.5}.sv-g.ok{background:#E3F4EA}.sv-g.no{background:#FBE9E6}
.kn{margin-top:14px;padding:12px;border-radius:14px;background:#F7F9FB}
.kn h3{margin:0 0 8px}
.kn-z{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kn-h button{display:flex;align-items:center;gap:8px;max-width:240px;padding:6px 10px 6px 6px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.kn-h button:disabled{opacity:.55;cursor:default;border-style:dashed}
.kn-h b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--kc);color:#fff;font-family:'JetBrains Mono',monospace;flex:none}
.kn-h span{display:grid;font-weight:700;font-size:13px;line-height:1.3}.kn-h small{font-weight:500;color:var(--muted);font-size:11.5px}
.kn-h.gor button{border-color:var(--ok)}.kn-h.acik button{border-color:var(--kc);box-shadow:2px 2px 0 var(--kc)}
.kn-ok{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted)}.kn-ok.ok{color:var(--ok)}.kn-ok.no{color:var(--bad)}
