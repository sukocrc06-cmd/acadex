# Sınav edge function'larını main'e birleşince Supabase'e deploy eder.
#
# Kurulum (bir kez, kullanıcı yapar):
#   1. supabase.com → Account → Access Tokens → yeni token
#   2. GitHub → repo Settings → Secrets and variables → Actions →
#      New repository secret: SUPABASE_ACCESS_TOKEN
# Token yoksa iş "atlandı" diye biter, hiçbir şey deploy edilmez.
#
# Güvenlik: her çalışmada canlı kod indirilir ve Git geçmişiyle karşılaştırılır.
# main ile aynıysa atlanır; geçmişteki bir sürümse deploy edilir (kaçırılmış
# deploy da tamamlanır); hiçbir sürüme uymuyorsa (panelden değişmiş) deploy
# edilmez, elle çalıştırıp "force" seçilirse yapılır.
name: Deploy exam functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/generate-exam/**'
      - 'supabase/functions/grade-exam/**'
      - 'supabase/functions/extract-chart-items/**'
      - 'supabase/functions/exam-appeal/**'
      - 'supabase/functions/get-exam-hint/**'
      - '.github/workflows/deploy-exam-functions.yml'
      - '.github/scripts/deploy-exam-functions.sh'
      - '.github/scripts/code-fingerprint.cjs'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Denetlenecekler (boşlukla ayrılmış; boşsa hepsi)'
        required: false
        default: ''
      force:
        description: 'Canlı kod GitHub dışında değişmiş olsa da deploy et'
        type: boolean
        default: false

concurrency:
  group: deploy-exam-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: yrcdvcsowblzmkpbmkut
    steps:
      # 30.10.2026: Node 20 eylem uyarıları; checkout v6 Node 24 ile çalışır,
      # setup-cli v3 composite (koşucudaki Node 20+ ile CLI kurar).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Token var mı
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN tanımlı değil; deploy atlandı." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v3
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest

      # Kod parmak izi (code-fingerprint.cjs) için TypeScript derleyicisi.
      - name: TypeScript
        if: steps.token.outputs.ok == 'true'
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/ts" typescript@5.6.3 >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/ts/node_modules" >> "$GITHUB_ENV"

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        env:
          INPUT_FUNCTIONS: ${{ github.event.inputs.functions }}
          FORCE: ${{ github.event.inputs.force }}
        run: bash .github/scripts/deploy-exam-functions.sh
