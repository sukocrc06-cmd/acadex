<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paketini seç · Acadex</title>
<meta name="description" content="Acadex Lite ve Premium paketleri: güvenli ödeme iyzico ile.">
<meta name="theme-color" content="#0D1838">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo-icon-only.png">
<!-- ÖDEME SAYFASI (28.10.2026, test raporu R91). Fiyatlar plan_prices tablosundan
     okunur; ödeme iyzico'nun kendi sayfasında alınır (kart bilgisi bu siteye hiç
     gelmez). Sunucu tarafı: supabase/functions/odeme. Dil: TR / EN (raporun notu). -->
<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-display:swap;font-weight:200 800;src:url(assets/landing/fonts/bricolage-latin-ext.woff2) format('woff2-variations')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-display:swap;font-weight:400 700;src:url(assets/landing/fonts/instrument-latin-ext.woff2) format('woff2-variations')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-display:swap;font-weight:500;src:url(assets/landing/fonts/jbmono-latin-ext.woff2) format('woff2')}
@font-face{font-family:'Caveat';font-style:normal;font-display:swap;font-weight:500 600;src:url(assets/landing/fonts/caveat-latin-ext.woff2) format('woff2')}
:root{--ink:#1A2A5C;--navy:#0D1838;--blue:#2F6BFF;--muted:#4B5675;--soft:#6A7593;--paper:#F6F7FB;--red:#C9483B;--green:#1E8A55;--line:#DCE2EE}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--navy);background:var(--paper);-webkit-font-smoothing:antialiased}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.hand{font-family:'Caveat','Segoe Print',cursive;font-weight:600}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1040px;margin:0 auto;padding:18px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:700;font-size:20px;min-height:44px}
.brand img{width:32px;height:32px}
.lang{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{min-height:40px;min-width:48px;border:0;background:#fff;font:inherit;font-weight:700;color:var(--soft);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
main{max-width:1040px;margin:0 auto;padding:6px 20px 80px}
h1{margin:6px 0 4px;font-size:clamp(30px,4vw,44px);letter-spacing:-.02em}
.sub{margin:0 0 22px;color:var(--muted);font-size:17px}
.beta{display:flex;gap:10px;align-items:center;margin:0 0 20px;padding:10px 14px;background:#FFF6D8;border:1px solid #F0DB8E;border-radius:10px;font-size:14.5px}
.beta b.tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;background:#E8B53A;color:#fff;padding:2px 7px;border-radius:4px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 18px 30px -26px rgba(13,24,56,.5)}
.card h2{margin:0 0 12px;font-size:20px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.plan{position:relative;display:block;padding:14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:#fff}
.plan input{position:absolute;opacity:0}
.plan b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:20px}
.plan small{color:var(--soft);font-size:13px}
.plan:has(input:checked){border-color:var(--blue);background:#F3F7FF}
.plan:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.periods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.per{position:relative}
.per input{position:absolute;opacity:0}
.per span{display:inline-flex;flex-direction:column;align-items:flex-start;min-height:52px;justify-content:center;padding:6px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:700}
.per span small{font-weight:500;color:var(--soft);font-size:12.5px}
.per input:checked + span{border-color:var(--navy);background:var(--navy);color:#fff}
.per input:checked + span small{color:#C9D3EC}
.per input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}
.per input:disabled + span{opacity:.4;cursor:not-allowed}
.fl{display:block;margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--muted)}
.fl small{font-weight:500;color:var(--soft)}
input[type=text],input[type=tel],textarea{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:15px;background:#fff;color:var(--navy)}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,255,.14)}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coupon{display:flex;gap:8px}
.coupon input{text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}
.btn-blue{background:var(--blue);color:#fff}
.btn-line{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn:disabled{opacity:.55;cursor:progress}
.sum{display:grid;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.sum li{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.sum li.tot{padding-top:10px;border-top:1px dashed var(--line);font-size:20px;font-weight:800}
.sum .old{text-decoration:line-through;color:var(--soft);font-weight:500;margin-right:6px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px;line-height:1.4}
.chk input{width:20px;height:20px;margin-top:1px;flex:none}
.err{margin:10px 0 0;padding:10px 12px;border-radius:9px;background:#FDECEA;color:#8E2A20;font-size:14.5px}
.ok{margin:10px 0 0;padding:10px 12px;border-radius:9px;background:#E5F4EC;color:#156B41;font-size:14.5px}
.secure{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--soft);font-size:13px}
.result{max-width:560px;margin:40px auto;text-align:center}
.result h1{font-size:34px}
[hidden]{display:none!important}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
@media (max-width:420px){.plans,.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><img src="assets/logo-icon-only.png" alt="" width="32" height="32"><span class="disp">Acadex</span></a>
  <div class="lang" role="group" aria-label="Dil / Language"><button type="button" data-l="tr" aria-pressed="true">TR</button><button type="button" data-l="en" aria-pressed="false">EN</button></div>
</header>

<main id="main">
  <!-- sonuç ekranı (iyzico'dan dönüşte) -->
  <section class="result" data-result hidden aria-live="polite">
    <h1 class="disp" data-r-t></h1>
    <p class="sub" data-r-s></p>
    <a class="btn btn-blue" href="dashboard.html" data-t="toApp"></a>
    <p><a href="odeme.html" data-t="again" data-r-again hidden></a></p>
  </section>

  <section data-shop>
    <h1 class="disp" data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <p class="beta" data-beta><b class="tag">BETA</b><span data-t="beta"></span></p>

    <form class="grid" data-form novalidate>
      <div class="card">
        <h2 class="disp" data-t="pickPlan"></h2>
        <div class="plans" role="radiogroup">
          <label class="plan"><input type="radio" name="plan" value="lite"><b>Lite</b><small data-t="liteWho"></small></label>
          <label class="plan"><input type="radio" name="plan" value="premium" checked><b>Premium</b><small data-t="premWho"></small></label>
        </div>
        <h2 class="disp" data-t="pickPeriod"></h2>
        <div class="periods" data-periods></div>

        <h2 class="disp" data-t="billing"></h2>
        <div class="row2">
          <div><label class="fl" for="b-name" data-t="name"></label><input id="b-name" type="text" autocomplete="given-name" maxlength="60" required></div>
          <div><label class="fl" for="b-surname" data-t="surname"></label><input id="b-surname" type="text" autocomplete="family-name" maxlength="60" required></div>
        </div>
        <div class="row2">
          <div><label class="fl" for="b-phone" data-t="phone"></label><input id="b-phone" type="tel" autocomplete="tel" maxlength="20" placeholder="+90 5xx xxx xx xx" required></div>
          <div><label class="fl" for="b-city" data-t="city"></label><input id="b-city" type="text" autocomplete="address-level1" maxlength="40" required></div>
        </div>
        <label class="fl" for="b-address" data-t="address"></label><textarea id="b-address" autocomplete="street-address" maxlength="200" required></textarea>
        <label class="fl" for="b-tckn"><span data-t="tckn"></span> <small data-t="optional"></small></label><input id="b-tckn" type="text" inputmode="numeric" maxlength="11" pattern="\d{11}">
      </div>

      <div class="card">
        <h2 class="disp" data-t="summary"></h2>
        <ul class="sum" data-sum></ul>
        <label class="fl" for="b-coupon" data-t="coupon"></label>
        <div class="coupon"><input id="b-coupon" type="text" maxlength="32" autocomplete="off"><button type="button" class="btn btn-line" data-coupon-apply data-t="apply"></button></div>
        <label class="chk"><input type="checkbox" data-agree required><span data-t-html="agree"></span></label>
        <button type="submit" class="btn btn-blue" style="width:100%" data-pay></button>
        <p class="err" data-err role="alert" hidden></p>
        <p class="secure"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5 V7.5 C8 5.3 9.8 3.5 12 3.5 C14.2 3.5 16 5.3 16 7.5 V10.5"/></svg><span data-t="secure"></span></p>
      </div>
    </form>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script>
(function () {
  var T = {
    tr: {
      title: 'Paketini seç', sub: 'Ödemeyi iyzico güvenli ödeme sayfasında yaparsın; kart bilgin Acadex\'e gelmez.',
      beta: 'Beta boyunca herkes Premium kullanıyor. Şimdi ödeme yaparsan süren beta bittiğinde başlamaz, bugünden işler.',
      pickPlan: 'Paket', pickPeriod: 'Süre', liteWho: 'düzenli ders çalışanlar için', premWho: 'yoğun dönem, proje ve tez için',
      billing: 'Fatura bilgileri', name: 'Ad', surname: 'Soyad', phone: 'Cep telefonu', city: 'Şehir', address: 'Adres',
      tckn: 'T.C. kimlik no', optional: '(isteğe bağlı, e-arşiv fatura için)', summary: 'Özet', coupon: 'İndirim kuponu', apply: 'Uygula',
      agree: '<a href="legal.html#on-bilgilendirme" target="_blank">Ön Bilgilendirme Formu</a>\'nu ve <a href="legal.html#mesafeli-satis" target="_blank">Mesafeli Satış Sözleşmesi</a>\'ni okudum, kabul ediyorum. <a href="legal.html#iptal-iade" target="_blank">İptal ve iade koşulları</a>',
      pay: 'Güvenli öde · ', secure: 'iyzico ile 3D Secure ödeme. Abonelik değildir; süre bitince kendiliğinden yenilenmez.',
      month: '1 ay', term: '1 dönem', year: '1 yıl', week: 'Sınav haftası · 7 gün', perMonth: 'aylık', save: '%{n} tasarruf',
      item: 'Paket', period: 'Süre', discount: 'Kupon', total: 'Toplam (KDV dahil)',
      needAgree: 'Devam etmek için sözleşmeleri onayla.', needFields: 'Ad, soyad, telefon, şehir ve adresi doldur.', badTckn: 'T.C. kimlik no 11 hane olmalı (ya da boş bırak).',
      noPrices: 'Fiyatlar şu an yüklenemedi. Biraz sonra tekrar dene.', svcErr: 'Ödeme başlatılamadı: ', couponOk: 'Kupon ödeme adımında uygulanacak.',
      okT: 'Ödemen alındı ✓', okS: '{p} paketin {d} tarihine kadar açık. İyi çalışmalar!', failT: 'Ödeme tamamlanmadı', failS: 'Kartından para çekilmediyse yeniden deneyebilirsin. Sorun sürerse bize yaz.',
      pendT: 'Ödemen kontrol ediliyor', pendS: 'Bu birkaç dakika sürebilir; sayfayı yenileyebilirsin.', toApp: 'Acadex\'e dön', again: 'Yeniden dene'
    },
    en: {
      title: 'Choose your plan', sub: 'You pay on iyzico\'s secure payment page; your card details never reach Acadex.',
      beta: 'During the beta everyone uses Premium. If you pay now, your period starts today, not when the beta ends.',
      pickPlan: 'Plan', pickPeriod: 'Duration', liteWho: 'for steady studying', premWho: 'for busy terms, projects and theses',
      billing: 'Billing details', name: 'First name', surname: 'Last name', phone: 'Mobile phone', city: 'City', address: 'Address',
      tckn: 'Turkish ID no', optional: '(optional, for the e-invoice)', summary: 'Summary', coupon: 'Coupon', apply: 'Apply',
      agree: 'I have read and accept the <a href="legal.html#on-bilgilendirme" target="_blank">Preliminary Information Form</a> and the <a href="legal.html#mesafeli-satis" target="_blank">Distance Sales Agreement</a>. <a href="legal.html#iptal-iade" target="_blank">Cancellation and refunds</a>',
      pay: 'Pay securely · ', secure: '3D Secure payment by iyzico. Not a subscription; it does not renew automatically.',
      month: '1 month', term: '1 term', year: '1 year', week: 'Exam week · 7 days', perMonth: 'per month', save: 'save {n}%',
      item: 'Plan', period: 'Duration', discount: 'Coupon', total: 'Total (VAT incl.)',
      needAgree: 'Please accept the agreements to continue.', needFields: 'Please fill in name, surname, phone, city and address.', badTckn: 'Turkish ID must be 11 digits (or leave it empty).',
      noPrices: 'Prices could not be loaded. Please try again shortly.', svcErr: 'Payment could not be started: ', couponOk: 'The coupon will be applied at checkout.',
      okT: 'Payment received ✓', okS: 'Your {p} plan is active until {d}. Happy studying!', failT: 'Payment not completed', failS: 'If you were not charged you can try again. Write to us if it keeps failing.',
      pendT: 'Checking your payment', pendS: 'This can take a few minutes; you can refresh the page.', toApp: 'Back to Acadex', again: 'Try again'
    }
  };
  var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var lang = 'tr'; try { lang = localStorage.getItem('acadexUILang') === 'en' ? 'en' : 'tr'; } catch (e) {}
  var t = function (k) { return (T[lang] || T.tr)[k] || T.tr[k] || k; };
  var PRICES = [], q = new URLSearchParams(location.search);
  var tl = function (k) { return (k / 100).toLocaleString(lang === 'en' ? 'en-US' : 'tr-TR', { minimumFractionDigits: k % 100 ? 2 : 0, maximumFractionDigits: 2 }) + ' TL'; };
  var cur = function () { var p = ($('input[name=plan]:checked') || {}).value, d = ($('input[name=per]:checked') || {}).value; return PRICES.filter(function (x) { return x.plan === p && x.period === d; })[0] || null; };

  var paintText = function () {
    document.documentElement.lang = lang;
    $$('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
    $$('[data-t-html]').forEach(function (el) { el.innerHTML = T[lang][el.getAttribute('data-t-html')]; });
    $$('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === lang)); });
    paintPeriods(); paintSum();
  };
  var paintPeriods = function () {
    var plan = ($('input[name=plan]:checked') || {}).value, box = $('[data-periods]'), was = ($('input[name=per]:checked') || {}).value || q.get('donem') || 'month';
    var mine = PRICES.filter(function (x) { return x.plan === plan; }), month = mine.filter(function (x) { return x.period === 'month'; })[0];
    box.innerHTML = ['month', 'term', 'year', 'week'].map(function (k) {
      var p = mine.filter(function (x) { return x.period === k; })[0]; if (!p) return '';
      var note = tl(p.amount_kurus);
      if (month && k !== 'month' && k !== 'week') { var full = month.amount_kurus * p.days / 30, s = Math.round((1 - p.amount_kurus / full) * 100); if (s > 0) note += ' · ' + t('save').replace('{n}', s); }
      return '<label class="per"><input type="radio" name="per" value="' + k + '"' + (k === was ? ' checked' : '') + '><span>' + t(k) + '<small>' + note + '</small></span></label>';
    }).join('');
    if (!$('input[name=per]:checked')) { var f = $('input[name=per]'); if (f) f.checked = true; }
  };
  var paintSum = function () {
    var p = cur(), btn = $('[data-pay]');
    if (!p) { $('[data-sum]').innerHTML = ''; btn.textContent = t('pay').replace(/ · $/, ''); btn.disabled = !PRICES.length; return; }
    $('[data-sum]').innerHTML = '<li><span>' + t('item') + '</span><b>' + (p.plan === 'premium' ? 'Premium' : 'Lite') + '</b></li><li><span>' + t('period') + '</span><b>' + t(p.period) + '</b></li>' +
      ($('#b-coupon').value.trim() ? '<li><span>' + t('discount') + '</span><b class="mono">' + $('#b-coupon').value.trim().toUpperCase() + '</b></li>' : '') +
      '<li class="tot"><span>' + t('total') + '</span><span>' + tl(p.amount_kurus) + '</span></li>';
    btn.textContent = t('pay') + tl(p.amount_kurus); btn.disabled = false;
  };
  var err = function (m) { var e = $('[data-err]'); e.textContent = m || ''; e.hidden = !m; if (m) e.scrollIntoView({ block: 'nearest' }); };
  var fnErr = async function (error) { try { var b = await error.context.json(); return b && b.error; } catch (e) { return error && error.message; } };

  $$('.lang button').forEach(function (b) { b.addEventListener('click', function () { lang = b.getAttribute('data-l'); try { localStorage.setItem('acadexUILang', lang); } catch (e) {} paintText(); }); });
  $('[data-form]').addEventListener('change', function (e) { if (e.target.name === 'plan') paintPeriods(); paintSum(); });
  $('[data-coupon-apply]').addEventListener('click', function () { paintSum(); if ($('#b-coupon').value.trim()) { err(''); var m = $('[data-err]'); m.className = 'ok'; m.textContent = t('couponOk'); m.hidden = false; setTimeout(function () { m.className = 'err'; m.hidden = true; }, 3500); } });

  $('[data-form]').addEventListener('submit', async function (e) {
    e.preventDefault(); err('');
    var p = cur(); if (!p) return;
    var buyer = { name: $('#b-name').value.trim(), surname: $('#b-surname').value.trim(), phone: $('#b-phone').value.trim(), city: $('#b-city').value.trim(), address: $('#b-address').value.trim(), identityNumber: $('#b-tckn').value.trim() };
    if (!buyer.name || !buyer.surname || buyer.phone.replace(/\D/g, '').length < 10 || !buyer.city || buyer.address.length < 5) { err(t('needFields')); return; }
    if (buyer.identityNumber && !/^\d{11}$/.test(buyer.identityNumber)) { err(t('badTckn')); return; }
    if (!$('[data-agree]').checked) { err(t('needAgree')); return; }
    try { sessionStorage.setItem('acadex.odeme.buyer', JSON.stringify({ name: buyer.name, surname: buyer.surname, phone: buyer.phone, city: buyer.city, address: buyer.address })); } catch (x) {}
    var btn = $('[data-pay]'); btn.disabled = true;
    var r = await supabaseClient.functions.invoke('odeme', { body: { action: 'baslat', plan: p.plan, period: p.period, coupon: $('#b-coupon').value.trim(), locale: lang, buyer: buyer, donus: location.origin } });
    if (r.error || !r.data || !r.data.paymentPageUrl) { btn.disabled = false; err(t('svcErr') + ((r.error && await fnErr(r.error)) || (r.data && r.data.error) || '?')); return; }
    location.href = r.data.paymentPageUrl;
  });

  var showResult = async function (id, durum) {
    $('[data-shop]').hidden = true; var R = $('[data-result]'); R.hidden = false;
    var set = function (tt, ss, again) { $('[data-r-t]').textContent = tt; $('[data-r-s]').textContent = ss; $('[data-r-again]').hidden = !again; };
    if (!id) { set(t('failT'), t('failS'), true); return; }
    var r = await supabaseClient.functions.invoke('odeme', { body: { action: 'durum', siparis: id } });
    var o = r.data && r.data.siparis;
    if (o && o.status === 'paid') set(t('okT'), t('okS').replace('{p}', o.plan === 'premium' ? 'Premium' : 'Lite').replace('{d}', new Date(o.plan_until).toLocaleDateString(lang === 'en' ? 'en-GB' : 'tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })), false);
    else if (o && o.status === 'pending' && durum !== 'hata') set(t('pendT'), t('pendS'), false);
    else set(t('failT'), (o && o.fail_reason ? o.fail_reason + '. ' : '') + t('failS'), true);
  };

  (async function init() {
    var s = await supabaseClient.auth.getSession();
    if (!s.data || !s.data.session) { location.replace('login.html'); return; }
    if (q.get('durum')) { paintText(); showResult(q.get('siparis'), q.get('durum')); return; }
    var pk = q.get('paket'); if (pk === 'lite' || pk === 'premium') { var pr = $('input[name=plan][value=' + pk + ']'); if (pr) pr.checked = true; }
    try { var b = JSON.parse(sessionStorage.getItem('acadex.odeme.buyer') || 'null'); if (b) { $('#b-name').value = b.name || ''; $('#b-surname').value = b.surname || ''; $('#b-phone').value = b.phone || ''; $('#b-city').value = b.city || ''; $('#b-address').value = b.address || ''; } } catch (x) {}
    var r = await supabaseClient.from('plan_prices').select('plan, period, amount_kurus, days').eq('active', true);
    PRICES = (r.data || []);
    paintText();
    if (r.error || !PRICES.length) err(t('noPrices'));
  })();
